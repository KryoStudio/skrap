name: Bug
description: Something in Skrap does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Skrap touched a file it should not have? Please report it privately instead: **Security → Report a vulnerability** (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skrap version
      description: Settings → About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and language
      placeholder: "Windows 11 24H2, French"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Optional: %LOCALAPPDATA%\com.kryostudio.skrap\logs\skrap.log. It stays on your PC unless you paste it here."
      render: text
