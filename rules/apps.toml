# Apps: the caches of everyday programs. An app that is open is left alone. Hundreds more will
# come from BleachBit's CleanerML definitions, converted to this format.

[[rule]]
id = "apps.discord.cache"
category = "apps"
risk = "safe"
group = { en = "Discord", fr = "Discord" }
name = { en = "Cache", fr = "Cache" }
explain = { en = "Images, GIFs and videos seen in your chats. Downloaded again as you scroll; your messages stay on Discord.", fr = "Les images, GIF et vidéos vus dans tes discussions. Retéléchargés en défilant ; tes messages restent sur Discord." }
paths = [
  '%APPDATA%\discord\Cache',
  '%APPDATA%\discord\Code Cache',
  '%APPDATA%\discord\GPUCache',
]
running = ["Discord.exe"]

[[rule]]
id = "apps.vscode.cache"
category = "apps"
risk = "safe"
group = { en = "Visual Studio Code", fr = "Visual Studio Code" }
name = { en = "Cache and logs", fr = "Cache et journaux" }
explain = { en = "What the editor caches and logs. Rebuilt when it starts; your settings, extensions and projects stay.", fr = "Ce que l'éditeur met en cache et note. Recréé au démarrage ; tes réglages, extensions et projets restent." }
paths = [
  '%APPDATA%\Code\Cache',
  '%APPDATA%\Code\CachedData',
  '%APPDATA%\Code\Code Cache',
  '%APPDATA%\Code\GPUCache',
  '%APPDATA%\Code\logs',
]
running = ["Code.exe"]

