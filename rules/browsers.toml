# Browsers: caches only. Cookies and history come later, unticked, with a list of sites to stay
# signed in to. A browser that is open is left alone.

[[rule]]
id = "browsers.chrome.cache"
category = "browsers"
risk = "safe"
group = { en = "Chrome", fr = "Chrome" }
name = { en = "Cache", fr = "Cache" }
explain = { en = "Copies of pages, images and scripts from the sites you visited, in every profile. Downloaded again as you browse; you stay signed in.", fr = "Des copies des pages, images et scripts des sites visités, dans tous les profils. Retéléchargées en naviguant ; tu restes connecté." }
paths = [
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\ShaderCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\GrShaderCache',
  '%LOCALAPPDATA%\Google\Chrome\User Data\GraphiteDawnCache',
]
running = ["chrome.exe"]

